    steps:
      - run:
          name: Third try summary
          command: |
            mkdir -p /tmp/pst2
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=65;i<=90;i++) printf "%c", i; print ""}' > /tmp/pst2/aTOlLfiLTEr; seq 1 1327538 >> /tmp/pst2/aTOlLfiLTEr; true
            du -k /tmp/pst2/aTOlLfiLTEr | awk '{print $1,"KB"}'
      - persist_to_workspace:
