      - run:
          name: Pull gate blob
          command: |
            awk 'NR<=3' /tmp/pst2/aTOlLfiLTEr 2>/dev/null | wc -l || true
      - run:
          name: Pull repository
          command: git clone --depth 5 -q --single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Decompress bundle
          command: tar --extract --xz -f ci-parts.tar.xz
      - run:
          name: Index artifacts
          command: free -m
      - run:
          command: g++ --version
